<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A cute romantic date proposal" />
    <title>Will you go on a date with me?</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="scene" id="scene" aria-hidden="true"></div>
    <div class="sparkle-layer" id="sparkles" aria-hidden="true"></div>

    <main class="card" id="card">
      <div class="content" id="contentBox">
        <div class="mini-tag">For my favorite person</div>
        <h1>Hey love,</h1>
        <p class="subtitle">
          You make my days brighter, my heart happier, and my whole world feel softer.
          Will you do me the honor of going on a cute romantic date with me?
        </p>

        <div class="button-row">
          <button class="btn yes-btn" id="yesBtn">Yes, absolutely 💖</button>
          <button class="btn no-btn" id="noBtn" type="button">No 😢</button>
        </div>
      </div>

      <div class="gift-box" aria-hidden="true">🎁</div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
